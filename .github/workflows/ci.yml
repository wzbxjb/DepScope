name: DepScope verification
on: [push, pull_request]
permissions: {contents: read}
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:5.26-community@sha256:f1e52d4dc6da122468c4a3c1050a4f5e117f6d3268625237c34d49166f0d6082
        env: {NEO4J_AUTH: neo4j/ci-local-password}
        ports: [7687:7687]
        options: >-
          --health-cmd "wget -q --spider http://localhost:7474 || exit 1"
          --health-interval 5s --health-timeout 3s --health-retries 30
    env:
      NEO4J_URI: bolt://127.0.0.1:7687
      DEPSCOPE_TEST_NEO4J_URI: bolt://127.0.0.1:7687
      NEO4J_PASSWORD: ci-local-password
      DEEPSEEK_API_KEY: ''
      OLLAMA_BASE_URL: ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11.5'}
      - run: python -m pip install -r backend/requirements-dev.lock
      - run: python -m pip install --no-deps -e backend
      - run: python -m pytest backend/tests/unit backend/tests/integration -q
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22.23.3', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
        working-directory: frontend
      - run: npm test -- --run
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
