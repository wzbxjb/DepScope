name: DepScope verification
on: [push, pull_request, workflow_dispatch]
permissions: {contents: read}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      neo4j:
        image: neo4j:5.26-community@sha256:f1e52d4dc6da122468c4a3c1050a4f5e117f6d3268625237c34d49166f0d6082
        env: {NEO4J_AUTH: neo4j/ci-local-password}
        ports: ["7687:7687"]
        options: >-
          --health-cmd "wget -q --spider http://localhost:7474 || exit 1"
          --health-interval 5s --health-timeout 3s --health-retries 30
    env:
      NEO4J_URI: bolt://127.0.0.1:7687
      DEPSCOPE_TEST_NEO4J_URI: bolt://127.0.0.1:7687
      NEO4J_PASSWORD: ci-local-password
      DEEPSEEK_API_KEY: ''
      OLLAMA_BASE_URL: ''
      DEPSCOPE_DATA_ROOT: /tmp/depscope-tests
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - run: python -m pip install -r backend/requirements-dev.lock
      - run: python -m pip install --no-deps -e backend
      - name: Check Python syntax and undefined names
        run: python -m ruff check --select E9,F63,F7,F82 backend/src
      - name: Run unit tests
        run: python -m pytest backend/tests/unit -q
      - name: Run Neo4j integration tests
        run: python -m pytest backend/tests/integration -q
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22.23.3', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
        working-directory: frontend
      - run: npm test -- --run
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
