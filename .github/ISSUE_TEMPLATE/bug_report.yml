name: Bug report
description: Report a reproducible problem in DepScope.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "For security issues, follow SECURITY.md. Remove credentials and private inventories from reports."
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include a minimal input or public sample when possible.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Commit, OS, Docker/native setup, Python and Node versions.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs or screenshots
      description: Include the error and relevant context with private values removed.
