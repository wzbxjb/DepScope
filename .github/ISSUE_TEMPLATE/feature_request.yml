name: Feature request
description: Propose an improvement to a dependency investigation workflow.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or workflow
      description: What are you trying to do, and where does the current behavior fall short?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the expected result and any alternatives considered.
    validations:
      required: true
